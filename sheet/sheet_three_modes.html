<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>분석지 — 저작 · 정밀 인쇄물(1p) · 학생 게시물</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#EDEFF3;--paper:#fff;--ink:#1A1A1A;--soft:#586070;--faint:#8B92A0;--line:#E3E7EE;--lsoft:#EFF1F5;
    --red:#CC0000;--blue:#1155BB;--green:#176A33;--amber:#B8420A;--purple:#6A1B9A;
    --gline:#BFE6CB;--mono:"SF Mono",ui-monospace,Menlo,monospace;--serif:"Pretendard",-apple-system,"Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard",-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;padding:20px 14px 60px}
  .wrap{max-width:1140px;margin:0 auto}
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .legend{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:-4px 0 12px;padding:7px 12px;background:#F7F9FC;border:1px solid #E4E9F0;border-radius:8px;font-size:11px;color:#475}
  .legend .lg-title{font-weight:800;color:#2E4E8F;font-size:10.5px}
  .legend .lg-item{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .legend .lg-line{display:inline-block;width:16px;height:0;border-bottom:2px solid #999}
  .legend .lg-red{border-bottom-color:#CC0000}
  .legend .lg-blue{border-bottom-color:#1155BB}
  .legend .lg-dot{border-bottom:2px dotted #C7CCD6}
  .legend .lg-chip{display:inline-block;width:12px;height:12px;border-radius:3px;background:#B7BDC8}
  .legend .lg-cred{background:#CC2222}.legend .lg-cblue{background:#2E4E8F}.legend .lg-cpurple{background:#6A1B9A}.legend .lg-corange{background:#C2660A}
  .legend .lg-sep{width:1px;height:14px;background:#D6DEEA;margin:0 2px}
  .seg{display:flex;background:#fff;border:1px solid #D2D7E0;border-radius:11px;padding:3px}
  .seg button{border:none;background:none;font-family:inherit;font-size:13px;font-weight:700;color:var(--soft);padding:8px 15px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--ink);color:#fff}
  .note{font-size:12px;color:var(--faint)}
  .print{margin-left:auto;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:9px;cursor:pointer;display:none}
  .print.show{display:inline-block}
  .sheet{background:var(--paper);border:1px solid #D2D7E0;border-radius:10px;box-shadow:0 12px 40px -22px rgba(16,24,40,.3);overflow:visible}
  .head{display:flex;align-items:center;border-bottom:2px solid #2E4E8F;background:linear-gradient(#fff,#F7F9FC);border-radius:10px 10px 0 0}
  .head .num{background:#2E4E8F;color:#fff;font-weight:800;font-size:14px;padding:9px 12px;border-radius:9px 0 0 0}
  .head .typ{font-weight:800;font-size:12.5px;color:#2E4E8F;padding:0 12px;border-right:1px solid var(--line);white-space:nowrap}
  .head .tt{padding:0 12px;font-size:11.5px;color:var(--soft);line-height:1.3}
  .head .tt b{color:var(--ink)}.head .tt .en{font-family:var(--serif);font-style:italic;color:var(--faint);font-size:10.5px}
  .head .stars{margin-left:auto;padding:0 14px;font-size:11.5px;color:var(--amber);font-weight:700}

  /* ===== 저작 ===== */
  .auth{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
  @media(max-width:880px){.auth{grid-template-columns:1fr}}
  .a-main{padding:14px 16px;border-right:1px solid var(--lsoft)}
  .a-side{padding:13px;background:#FBFBFD}
  .a-side h3{font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--faint);text-transform:uppercase;margin:10px 0 7px}
  .a-side h3:first-child{margin-top:0}
  .sent{padding:7px 0 9px;border-bottom:1px dashed #EAEDF2}
  .sent .kr{margin:3px 0 0 20px;font-size:11.5px;color:#4A5568;line-height:1.5}
  /* ── 강사 자유 강조 도구 ── */
  .toolstrip{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
  .ts-label{font-size:11px;font-weight:700;color:#2E4E8F}
  .tool-btn{display:inline-flex;align-items:center;gap:3px;padding:5px 9px;border:1.5px solid #C2C8D2;background:#fff;color:#333;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}
  .tool-btn:hover{border-color:#2E4E8F}
  .tool-btn.on{border-color:#2E4E8F;background:#EBF0FA;color:#2E4E8F}
  .tool-btn.erase.on{border-color:#B91C1C;background:#FEF2F2;color:#B91C1C}
  .tool-btn.clearall{border-color:#B91C1C;color:#B91C1C}
  .tool-btn.clearall:hover{background:#FEF2F2}
  .tool-btn .sw{display:inline-block;width:14px;height:0;border-bottom:2px solid #999}
  .tool-btn .sw-r{border-bottom-color:#CC0000}.tool-btn .sw-b{border-bottom-color:#1155BB}
  .en.marking{cursor:cell;user-select:text}
  .cnd-edit{color:#2E4E8F;font-weight:700;border-top:1px dashed var(--line)}
  .ref-badge{display:inline-block;margin:0 12px 0 0;padding:8px 14px;background:#2E4E8F;color:#fff;font-size:13px;font-weight:800;border-radius:9px 0 0 0;letter-spacing:.2px;white-space:nowrap}
  .ref-badge:empty{display:none}
  .en.marking .wd{cursor:cell}
  .wd.mk-ulr,.wsp.mk-ulr{border-bottom:2px solid #CC0000}
  .wd.mk-ulb,.wsp.mk-ulb{border-bottom:2px solid #1155BB}
  .wd.mk-hl,.wsp.mk-hl{background:#FFF3A3;border-radius:2px}
  /* 네모: 위·아래 선은 전체 연결, 좌/우 끝만 세로선+둥근모서리 */
  .wd.mk-box{border-top:1.5px solid #1f2937;border-bottom:1.5px solid #1f2937;padding:1px 0}
  .wsp.mk-box{border-top:1.5px solid #1f2937;border-bottom:1.5px solid #1f2937}
  .wd.mk-box-l{border-left:1.5px solid #1f2937;border-top-left-radius:4px;border-bottom-left-radius:4px;padding-left:2px}
  .wd.mk-box-r{border-right:1.5px solid #1f2937;border-top-right-radius:4px;border-bottom-right-radius:4px;padding-right:2px}
  .sline{display:flex;gap:8px;align-items:flex-start}
  .bul{flex:none;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;margin-top:3px}
  .en{font-family:var(--serif);font-size:14px;line-height:1.85;color:#1A1A1A}
  .snum{font-weight:800;color:var(--ink);margin-right:5px}
  .en .wd{cursor:pointer;border-radius:2px;padding:0 .5px}
  .en .wd:hover{background:#EEF3FC}
  .en .wd.gp{border-bottom:2px solid var(--red)}.en .wd.vp{border-bottom:2px solid var(--blue)}
  .en .wd.gp.off,.en .wd.vp.off{border-bottom:2px dotted #C7CCD6}
  .ko{font-size:11px;color:var(--faint);margin:4px 0 0 26px;line-height:1.5}
  .grp{margin-bottom:9px}.grp .gh{font-size:10.5px;font-weight:800;margin:0 0 4px}
  .row{display:flex;gap:7px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:#fff}
  .row.unchk{opacity:.5;background:#FAFAFB}
  .row .ck{flex:none;width:16px;height:16px;border-radius:5px;border:1.5px solid #C2C8D2;margin-top:1px;cursor:pointer;display:grid;place-items:center;font-size:10px;color:#fff;font-weight:800}
  .row.chk .ck{background:var(--green);border-color:var(--green)}
  .row .lab{font-size:11.5px;font-weight:700;line-height:1.3}
  .row .det{font-size:10px;color:var(--faint);margin-top:1px}
  .row .meta{display:flex;align-items:center;gap:7px;margin-top:4px}
  .src{font-size:8.5px;font-weight:800;padding:1px 5px;border-radius:8px;background:#EEF1F6;color:var(--soft)}
  .src.db{background:#E3F3E9;color:var(--green)}.src.new{background:#F0E4F8;color:var(--purple)}
  .imp{display:flex;gap:2px;cursor:pointer;margin-left:auto;align-items:center}
  .imp i{width:6px;height:6px;border-radius:50%;background:#D8DCE4}.imp i.on{background:var(--amber)}
  .imp .t{font-size:8.5px;color:var(--faint);margin-left:3px}
  /* pick (주제/제목/요약 후보 선택) */
  .pick{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:6px;background:#fff}
  .pick .pl{font-size:10.5px;font-weight:800;color:#2E4E8F;margin-bottom:3px;display:flex;align-items:center;gap:6px}
  .pick .cur{font-size:11.5px;color:#1A1A1A;line-height:1.4;cursor:pointer;border:1px dashed #C9D6EC;border-radius:6px;padding:5px 7px}
  .pick .cur:hover{background:#F0F4FB}
  .pick .cur .e{font-family:var(--serif);font-size:10.5px;color:var(--faint);display:block}
  .cands{margin-top:5px;display:none}
  .cands.open{display:block}
  .cnd{font-size:11px;color:var(--soft);line-height:1.4;padding:5px 7px;border:1px solid var(--line);border-radius:6px;margin-bottom:4px;cursor:pointer}
  .cnd:hover{background:#F1FAF3;border-color:var(--gline)}
  .cnd.sel{background:#EAF7EE;border-color:var(--green);color:#1A1A1A;font-weight:600}
  .cnd .e{font-family:var(--serif);font-size:10px;color:var(--faint);display:block;font-style:italic}
  .tgrp{margin-bottom:8px}.tgh{font-size:9.5px;font-weight:800;color:var(--soft);margin-bottom:4px}
  .tgchips{display:flex;flex-wrap:wrap;gap:4px}
  .tchip{font-size:10px;font-weight:600;color:var(--faint);background:#fff;border:1px solid var(--line);border-radius:7px;padding:3px 7px;cursor:pointer}
  .tchip.on{color:#1A1A1A;border-color:#2E4E8F;background:#F0F4FB}
  .atag{display:inline-block;font-size:9px;font-weight:800;color:#fff;border-radius:5px;padding:1px 7px;margin-right:6px;vertical-align:2px;cursor:pointer;letter-spacing:.02em}
  .atag.red{background:#CC2222}.atag.blue{background:#2E4E8F}.atag.purple{background:#6A1B9A}.atag.orange{background:#C2660A}.atag.none{background:#B7BDC8}
  .hltog{font-size:8.5px;font-weight:800;padding:1px 6px;border-radius:8px;cursor:pointer;background:#F0F1F4;color:#9AA0AC;border:1px solid #E0E3EA}
  .hltog.on{background:#FFF1A0;color:#8A6A00;border-color:#E8C84B}
  .tagdd{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0;padding:6px;background:#F7F8FA;border:1px solid var(--line);border-radius:8px}
  .tagopt{font-size:9.5px;font-weight:800;color:#fff;border-radius:5px;padding:2px 8px;cursor:pointer;opacity:.5}
  .tagopt.sel,.tagopt:hover{opacity:1}
  .tagopt.red{background:#CC2222}.tagopt.blue{background:#2E4E8F}.tagopt.purple{background:#6A1B9A}.tagopt.orange{background:#C2660A}.tagopt.none{background:#B7BDC8}
  .stars-edit{font-size:18px;line-height:1}
  .stedit{color:#D8DCE4;cursor:pointer}.stedit.on{color:#C2660A}

  /* popover */
  .pop{position:fixed;z-index:120;width:320px;background:#fff;border:1px solid #D2D7E0;border-radius:12px;box-shadow:0 18px 50px -14px rgba(16,24,40,.45);display:none}
  .pop.show{display:block}
  .pop .ph{padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;background:#FAFBFD}
  .pop .ph b{font-family:var(--serif);font-size:14px}.pop .ph .x{float:right;cursor:pointer;color:#aaa}
  .pop .sec{padding:8px 12px}.pop .sl{font-size:9.5px;font-weight:800;letter-spacing:.04em;color:var(--green);text-transform:uppercase;margin-bottom:5px}.pop .sl.m{color:var(--purple)}
  .cand{display:flex;gap:8px;padding:7px 8px;border:1px solid var(--gline);background:#F2FBF4;border-radius:8px;margin-bottom:5px;cursor:pointer}
  .cand:hover{background:#E8F6EC}.cand .pl2{font-size:11.5px;font-weight:700;color:#1A5A30;line-height:1.3}.cand .pd{font-size:10px;color:#4B7A58;margin-top:1px}.cand .id{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--green);white-space:nowrap}
  .pop .manual{border-top:1px solid var(--line);background:#FCFAFE;padding:9px 12px}
  .pop .manual input{width:100%;border:1px solid #DDD;border-radius:7px;padding:6px 8px;font-family:inherit;font-size:11.5px;margin-bottom:5px}
  .pop .manual button{width:100%;border:none;background:var(--purple);color:#fff;font-weight:700;font-size:11.5px;padding:7px;border-radius:7px;cursor:pointer}
  .nocand{font-size:11px;color:var(--faint);padding:2px 0 6px}
  .vinfo{font-size:10.5px;color:var(--soft);line-height:1.5;margin-bottom:5px;padding:5px 7px;background:#F6F8FB;border:1px solid var(--line);border-radius:6px}
  .vinfo.ex{font-family:var(--serif);font-style:italic;color:var(--faint);background:#FAFBFC}
  .vinfo-mk{font-weight:800;color:var(--blue);margin-right:4px;font-style:normal}
  .glines{margin-top:3px}
  .gline{font-size:10.5px;color:#3A4250;line-height:1.55;padding:1px 0 1px 8px;border-left:2px solid #E0E6EF;margin-bottom:2px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:11px;font-weight:700;color:#1A5A30;background:#F2FBF4;border:1px solid var(--gline);border-radius:7px;padding:4px 8px;cursor:pointer}
  .chip em{font-style:normal;font-weight:500;color:#6B9478;font-size:10px}
  .chip.ant{color:#9A3A0A;background:#FCF2EC;border-color:#EAC9B6}.chip.ant em{color:#B58A72}
  .chip.sel{background:#1B7A3D;color:#fff;border-color:#1B7A3D}.chip.sel em{color:#D6F0DD}
  .chip.ant.sel{background:#B8420A;border-color:#B8420A}.chip.ant.sel em{color:#F5D8C6}
  .addbtn{width:100%;margin-top:8px;border:none;background:var(--green);color:#fff;font-weight:700;font-size:11.5px;padding:7px;border-radius:7px;cursor:pointer}
  .aibtn{width:100%;margin-top:7px;border:1px dashed #C4B0DD;background:#FBF8FE;color:var(--purple);font-weight:700;font-size:11px;padding:6px;border-radius:7px;cursor:pointer}

  /* ===== 정밀 인쇄물 (1페이지, 아잉카 밀도) ===== */
  .out{display:grid;grid-template-columns:minmax(0,1fr) 210px}
  @media(max-width:880px){.out{grid-template-columns:1fr}}
  .opass{padding:11px 13px 13px;border-right:1px solid var(--lsoft)}
  .psent{position:relative;margin-bottom:9px}
  .iline{line-height:1.28}
  /* 인쇄물: 영어(좌, 단어마다 위에 주석) / 한글(우) — flow 기반, 겹침 없음 */
  .prow{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px;padding:9px 0 8px;border-bottom:1px dashed #E7EBF1;align-items:start}
  .wline{line-height:2.7}
  .wchunk{position:relative;display:inline-block;vertical-align:bottom;margin-right:3px}
  .wchunk.lead{margin-right:2px}
  .wgn{position:absolute;bottom:100%;left:0;margin-bottom:1px;line-height:1.1}
  .wgnt{font-size:7px;line-height:1.12;font-weight:700;color:#176A33;border-bottom:1px solid #BFE6CB;white-space:normal;text-align:left;display:inline-block;max-width:120px}
  .wgn.v .wgnt{color:var(--blue);border-bottom-color:#C2D4F2}
  .wgn.key .wgnt{color:#0E5226;border-bottom-color:#2E8B4F;background:#FFF8D6}
  .wce{font-family:var(--serif);font-size:12px;line-height:1.3;color:#161616;white-space:nowrap}
  .wce .hl{font-weight:700;color:var(--red);border-bottom:1.5px solid var(--red)}
  .wce .hl.v{color:var(--blue);border-bottom-color:var(--blue)}
  .wce .hl.key{background:#FFF1A0;border-radius:2px;padding:0 1px}
  .wce .hl.v.key{background:#DCEAFF}
  .prow .pR{font-size:10.5px;line-height:1.6;color:#3f4a5a;border-left:2px solid #EDF1F7;padding-left:12px}
  .psent2{margin-bottom:11px;padding-bottom:9px;border-bottom:1px dashed #E7EBF1}
  .psent2 .pen{font-size:12px;line-height:1.55;color:#111}
  .psent2 .pen .pnum{display:inline-block;min-width:16px;font-weight:800;color:#2E4E8F;margin-right:2px}
  .psent2 .pkr{font-size:11px;line-height:1.5;color:#4A5568;margin:2px 0 0 18px}
  .psent2 .pnotes{margin:4px 0 0 18px;display:flex;flex-wrap:wrap;gap:5px 12px}
  .psent2 .pnote{font-size:9.5px;line-height:1.35;color:#176A33}
  .psent2 .pnote.v{color:var(--blue)}
  .psent2 .pnote b{font-weight:800}
  .stag{display:inline-block;font-size:8.5px;font-weight:800;color:#fff;border-radius:4px;padding:1px 5px;margin-right:4px;vertical-align:2px;letter-spacing:.02em}
  .stag.red{background:#CC2222}.stag.blue{background:#2E4E8F}.stag.purple{background:#6A1B9A}.stag.orange{background:#C2660A}
  .pnum{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:#2E4E8F;color:#fff;font-size:9px;font-weight:800;vertical-align:1px;margin-right:4px}
  .chunks{display:inline}
  .chunk{position:relative;display:inline-flex;flex-direction:column;margin-right:3px;vertical-align:top}
  .chunk .gn{position:absolute;bottom:100%;left:0;max-width:130px;display:flex;align-items:flex-end;margin-bottom:1px;z-index:1}
  .chunk .gnt{font-size:8px;line-height:1.15;font-weight:700;color:#176A33;border-bottom:1.5px solid #BFE6CB;padding-bottom:0;white-space:normal;text-align:left}
  .chunk .gn.v .gnt{color:var(--blue);border-bottom-color:#C2D4F2}
  .chunk .gn.key .gnt{color:#0E5226;border-bottom-color:#2E8B4F;background:#FFF8D6}
  .chunk .ce{font-family:var(--serif);font-size:12.5px;line-height:1.32;color:#161616;white-space:nowrap}
  .chunk .ce .hl{font-weight:700;color:var(--red);border-bottom:1.5px solid var(--red)}
  .chunk .ce .hl.v{color:var(--blue);border-bottom-color:var(--blue)}
  .chunk .ce .hl.key{background:#FFF1A0;border-radius:2px;padding:0 1px}
  .chunk .ce .hl.v.key{background:#DCEAFF}
  .chunk .ce .sl{color:#CBD0D8;font-weight:400;margin-left:3px}
  .chunk .ck{font-size:9px;color:#6B7480;line-height:1.25;margin-top:1px;white-space:nowrap}
  .oflow{padding:12px 12px;background:#FBFCFE}
  .oflow .fh{font-size:10px;font-weight:800;color:#2E4E8F;letter-spacing:.02em;margin-bottom:8px;padding-bottom:5px;border-bottom:1.5px solid #C9D6EC;text-align:center}
  .fstep{margin-bottom:9px;text-align:center}
  .fstep .fs{font-size:10px;font-weight:800;color:#2E4E8F;margin-bottom:2px}
  .fstep .ft{font-size:9.5px;color:var(--soft);line-height:1.4}
  .fstep .fk{font-family:var(--serif);font-style:italic;font-size:9px;color:var(--amber);display:block;margin-top:1px}
  .osum{margin-top:10px;padding-top:8px;border-top:1.5px solid #C9D6EC}
  .osum .sh{font-size:9px;font-weight:800;color:#2E4E8F;margin-bottom:4px}
  .osum .se{font-family:var(--serif);font-size:8.5px;line-height:1.4;color:#5A6270;font-style:italic}
  .osum .sk{font-size:8.5px;line-height:1.45;color:#8A909C;margin-top:3px}
  .legend{grid-column:1/-1;margin:0;padding:8px 14px;border-top:2px solid #2E4E8F;font-size:9px;color:var(--soft);display:flex;flex-wrap:nowrap;gap:7px;align-items:center;overflow:hidden;white-space:nowrap}
  .legend b{color:#2E4E8F;font-size:9.5px;flex:none}
  .legend span{flex:none}
  .legend .on{color:#1A1A1A;font-weight:700}
  .osum .sh,.obg .sh{font-size:9px;font-weight:800;color:#2E4E8F;margin-bottom:4px}
  .obg{margin-top:9px;padding-top:8px;border-top:1.5px solid #C9D6EC}
  .obg .bg{font-size:8.5px;line-height:1.45;color:#6B7480;font-family:"Pretendard",-apple-system,"Noto Sans KR",sans-serif}
  .head .stars .st{letter-spacing:1px}
  .head .stars .hst{cursor:pointer}

function tokenize(str,si,ctr){

      return cls?`<span class="wsp${cls}">${t}</span>`:t;
    }
    const c=t.toLowerCase().replace(/[^a-z']/g,'');
    const wi=ctr?ctr.n++:0;
    return `<span class="wd${markClsAt(si,wi)}" data-si="${si}" data-wi="${wi}" data-word="${c}">${esc(t)}</span>`;
  }).join('');
}

function _qp(){const p=new URLSearchParams(location.search);return {book:p.get('book')||'',unit:p.get('unit')||'',pid:p.get('pid')||''};}
function _wbtoken(){try{return localStorage.getItem('wb_token')||'';}catch(e){return '';}}
function serializeSheet(){
  const marks=[];
  S.forEach((chunks,si)=>chunks.forEach((c,ci)=>{
    if(c.h||c.n||c.key||c.i!==undefined){
      const m={si,ci};
      if('h'in c)m.h=c.h; if('f'in c)m.f=c.f; if('n'in c)m.n=c.n;
      if('d'in c)m.d=c.d; if('i'in c)m.imp=c.i; if('key'in c)m.key=c.key; if('s'in c)m.src=c.s;
      marks.push(m);
    }
  }));
  const custom={};
  if(SEL.title>=(NORIG.title||0)&&TITLES[SEL.title]){custom.title={k:TITLES[SEL.title][0]||'',e:TITLES[SEL.title][1]||''};}
  if(SEL.topic>=(NORIG.topic||0)&&TOPICS[SEL.topic]!==undefined){custom.topic={k:TOPICS[SEL.topic]||''};}
  if(SEL.sum>=(NORIG.sum||0)&&SUMS[SEL.sum]){custom.sum={k:SUMS[SEL.sum].k||'',e:SUMS[SEL.sum].e||''};}
  return {diff:DIFF,marks,
    selTitle:SEL.title||0,selTopic:SEL.topic||0,selSum:SEL.sum||0,
    tags:(typeof STAG!=='undefined'&&STAG)?STAG:{},summary:'',
    umarks:(typeof MARKS!=='undefined'&&MARKS)?MARKS:[],
    custom:custom};
}
async function saveSheet(silent){
  const {book,unit,pid}=_qp();
  if(!book||!unit||!pid){if(!silent)alert('이 화면엔 book/unit/pid 정보가 없어 저장할 수 없습니다.');return false;}
  const teacher=(document.getElementById('tchName').value||'').trim();
  try{localStorage.setItem('sheet_teacher',teacher);}catch(e){}
  const btn=document.getElementById('saveBtn');
  if(!silent){btn.disabled=true;btn.textContent='저장중…';}
  try{
    const r=await fetch('/api/sheet/save',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+_wbtoken()},
      body:JSON.stringify({book,unit,pid,teacher,sheet:serializeSheet()})});
    if(!r.ok)throw new Error('저장 실패 ('+r.status+')');
    if(!silent){btn.textContent='저장됨 ✓';setTimeout(()=>{btn.textContent='저장';btn.disabled=false;},1500);loadTeachers();}
    return true;
  }catch(e){if(!silent){alert(e.message||'저장 실패');btn.textContent='저장';btn.disabled=false;}return false;}
}
async function publishSheet(){
  const {book,unit,pid}=_qp();

      headers:{'Content-Type':'application/json','Authorization':'Bearer '+_wbtoken()},

  }catch(e){bar.textContent=e.message||'발행 실패';}

async function loadTeachers(){
  const {book,unit,pid}=_qp();if(!book||!unit||!pid)return;
  try{
    const r=await fetch(`/api/sheet/teachers?book=${encodeURIComponent(book)}&unit=${encodeURIComponent(unit)}&pid=${encodeURIComponent(pid)}`);
    if(!r.ok)return;const d=await r.json();
    const cur=(document.getElementById('tchName').value||'').trim();
    const list=(d.teachers||[]);
    // 숨은 드롭다운도 동기화(호환)
    const sel=document.getElementById('tchSel');
    if(sel)sel.innerHTML='<option value="">― 저장된 강사 ―</option>'+list.map(t=>{
      const v=(t.teacher||'');const nm=v||'(공용)';const vEsc=v.replace(/"/g,'&quot;');
      return `<option value="${vEsc}"${v===cur?' selected':''}>${esc(nm)}</option>`;
    }).join('');
    // ★ 강사 탭 렌더
    const tabs=document.getElementById('tchTabs');if(!tabs)return;
    // 기본 강사 명단(항상 탭으로 노출) + 저장된 강사 + 현재 강사 병합(중복 제거, 순서 유지)
    const DEFAULT_TEACHERS=['태림T','수지T'];
    const names=[];
    const _push=v=>{ if(v && !names.includes(v)) names.push(v); };
    DEFAULT_TEACHERS.forEach(_push);
    list.forEach(t=>_push(t.teacher||''));
    _push(cur);
    if(!names.length)names.push(cur);           // 최소 하나
    let html='<span class="tt-lb">강사</span>';
    html+=names.map(v=>{
      const nm=v||'(공용)';const on=(v===cur)?' on':'';
      return `<span class="tch-tab${on}" data-tch="${v.replace(/"/g,'&quot;')}">${esc(nm)}</span>`;
    }).join('');
    html+='<span class="tch-tab newt" data-newtab="1">＋ 새 강사</span>';
    tabs.innerHTML=html;
    tabs.querySelectorAll('.tch-tab').forEach(el=>{
      el.onclick=()=>{
        if(el.dataset.newtab){
          const nm=(prompt('새 강사 이름을 입력하세요:','')||'').trim();
          if(!nm)return;
          _gotoTeacher(nm);
        }else{
          const v=el.dataset.tch||'';
          if(v===cur)return;         // 이미 이 강사면 무시
          _gotoTeacher(v);
        }
      };
    });
  }catch(e){}
}
async function _gotoTeacher(v){
  try{localStorage.setItem('sheet_teacher',v);}catch(e){}
  const {book,unit,pid}=_qp();
  if(!book||!unit||!pid){ // 안전 폴백: 정보 없으면 기존 방식(새로고침)
    const p=new URLSearchParams(location.search);p.set('teacher',v);location.search=p.toString();return;
  }
  const tabs=document.getElementById('tchTabs');
  if(tabs)tabs.style.opacity='0.5';
  try{
    const r=await fetch(`/api/sheet/data?book=${encodeURIComponent(book)}&unit=${encodeURIComponent(unit)}&pid=${encodeURIComponent(pid)}&teacher=${encodeURIComponent(v)}`);
    if(!r.ok)throw new Error('load fail');
    const d=await r.json();
    // const 배열/객체는 '내용만' 교체
    S.length=0;(d.S||[]).forEach(x=>S.push(x));
    FLOW.length=0;(d.FLOW||[]).forEach(x=>FLOW.push(x));
    TITLES.length=0;(d.TITLES||[]).forEach(x=>TITLES.push(x));
    TOPICS.length=0;(d.TOPICS||[]).map(t=>Array.isArray(t)?t[0]:t).forEach(x=>TOPICS.push(x));
    Object.keys(VPOOL).forEach(k=>delete VPOOL[k]);Object.assign(VPOOL,d.VPOOL||{});
    Object.keys(POOL).forEach(k=>delete POOL[k]);Object.assign(POOL,d.POOL||{});
    // let 변수는 재할당
    DIFF=d.DIFF||3;
    MARKS=(Array.isArray(d.MARKS)?d.MARKS.map(m=>({si:+m.si,from:+m.from,to:+m.to,tool:m.tool||'box'})):[]);
    const s=d.SEL||{};SEL={title:s.title||0,topic:s.topic||0,sum:s.sum||0,openPick:null,openTag:null};
    // 직접입력 값 재적용 (배열은 위에서 원본으로 리셋됨)
    const cst=d.CUSTOM||null;
    if(cst){
      if(cst.title&&(cst.title.k||cst.title.e)){TITLES.push([cst.title.k||'',cst.title.e||'']);SEL.title=TITLES.length-1;}
      if(cst.topic&&cst.topic.k){TOPICS.push(cst.topic.k);SEL.topic=TOPICS.length-1;}
      if(cst.sum&&(cst.sum.k||cst.sum.e)){SUMS.push({k:cst.sum.k||'',e:cst.sum.e||''});SEL.sum=SUMS.length-1;}
    }
    if(_D){_D.REF=d.REF||_D.REF;_D.TEACHER=v;}
    // 강사명/URL 갱신(새로고침 없이)
    const inp=document.getElementById('tchName');if(inp)inp.value=v;
    const p=new URLSearchParams(location.search);p.set('teacher',v);
    history.replaceState(null,'','?'+p.toString());
    // 현재 모드로 다시 그림
    if(mode===0)renderAuth();else if(mode===1)renderOut();else renderPost();
    updateHeader();loadTeachers();
  }catch(e){
    // 실패하면 안전하게 기존 방식(새로고침)
    const p=new URLSearchParams(location.search);p.set('teacher',v);location.search=p.toString();
  }finally{
    if(tabs)tabs.style.opacity='';
  }
}
(function initSheetTools(){

  const wrap=document.getElementById('tchWrap');
  if(ro){if(wrap)wrap.style.display='none';return;}
  // ★ teacher 파라미터 없이 열렸는데 마지막 강사가 있으면, 그 강사 버전으로 다시 연다
  //   (안 그러면 항상 '공용(빈)' 버전이 떠서 저장한 게 사라진 것처럼 보임)
  const _sp=new URLSearchParams(location.search);
  if(!_sp.has('teacher')){
    let _last='';try{_last=localStorage.getItem('sheet_teacher')||'';}catch(e){}
    if(!_last)_last='태림T';   // 첫 방문 기본 강사
    _sp.set('teacher',_last); location.search=_sp.toString(); return;
  }
  let tname=(_D&&_D.TEACHER)||'';
  if(!tname){try{tname=localStorage.getItem('sheet_teacher')||'';}catch(e){}}
  const inp=document.getElementById('tchName');if(inp)inp.value=tname;
  const sb=document.getElementById('saveBtn');if(sb)sb.onclick=()=>saveSheet(false);
  const cmb=document.getElementById('clearMarksBtn');
  if(cmb)cmb.onclick=()=>{
    if(!MARKS.length){alert('지울 표시가 없습니다.');return;}
    if(confirm('이 강사가 친 밑줄·네모·형광 표시를 모두 지울까요?\n(0회독 어법·어휘 설명은 그대로 유지됩니다)')){
      MARKS=[];if(curTool)setTool(curTool);renderAuth();saveSheet(false);
    }
  };
  const sab=document.getElementById('saveAsBtn');
  if(sab)sab.onclick=()=>{
    const cur=(document.getElementById('tchName').value||'').trim();
    const nm=(prompt('새 강사 이름으로 저장합니다.\n이름을 입력하세요:', cur)||'').trim();
    if(!nm)return;
    document.getElementById('tchName').value=nm;
    saveSheet(false);   // 현재 표시·편집을 그 이름의 새 버전으로 저장
  };
  const lb=document.getElementById('linkBtn');if(lb)lb.onclick=publishSheet;
  const nvb=document.getElementById('newVerBtn');
  if(nvb)nvb.onclick=()=>{
    const nm=(prompt('새 강사 버전을 새로 만듭니다.\n강사 이름을 입력하세요:','')||'').trim();
    if(!nm)return;
    try{localStorage.setItem('sheet_teacher',nm);}catch(e){}
    const p=new URLSearchParams(location.search);p.set('teacher',nm);
    location.search=p.toString();   // 그 이름의 (아직 저장 안 된) 새 버전으로 열림 = 0회독 기본 상태에서 시작
  };
  const sel=document.getElementById('tchSel');if(sel)sel.onchange=function(){const v=this.value;try{localStorage.setItem('sheet_teacher',v);}catch(e){}const p=new URLSearchParams(location.search);p.set('teacher',v);location.search=p.toString();};
  loadTeachers();
})();
setMode((_D&&_D.MODE==='student')?2:0);
</script>
</body>
</html>
